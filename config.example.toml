# 仅包含公开配置；实际密钥使用环境变量或 --secret 文件。
# 默认单价见 src/video_learner/common/prices.toml；自定义 prices 表会整体替换默认表。
provider = "deepseek" # 改为 qwen 时，自动选择 qwen3.8-flash / DASHSCOPE_API_KEY。
# model = "deepseek-flash" # 可显式覆盖所选供应商的默认模型。
# api_key_env = "DEEPSEEK_API_KEY"
# secret_file = "secrets/deepseek.secret" # 文件优先于环境变量；路径相对于运行目录。
profile = "mixed"
instruction = "保留关键概念、推导与操作步骤，压缩重复说明"
allow_ai_additions = false

asr_backend = "qwen" # 可选 local；默认云端。
asr_device = "cpu" # 本地可选 cuda，CUDA 使用 jobs=1。
# asr_local_model = "small" # CPU 默认 small；CUDA 默认 large-v3-turbo；可填本地目录。
asr_cpu_threads = 4 # 每个本地 worker 的算子线程数。
asr_beam_size = 1
asr_language = "zh" # 英文原声设为 en。
asr_qwen_model = "qwen3-asr-flash"
asr_api_key_env = "DASHSCOPE_API_KEY"
# asr_secret_file = "secrets/aliyun.secret" # 同上；仅配置文件路径，不填写密钥值。
asr_window_seconds = 30 # 每片上限；末尾附近有停顿时提前切分，无句级时间戳。
asr_max_calls = 500
jobs = 1 # 仅 ASR 请求并发，范围 1–32；CLI --jobs 优先，图文整理保持串行。

sample_seconds = 2 # 明显切屏保留前一帧，另补周期帧和末帧。
chapter_seconds = 180 # 目标章长，尽量对齐附近转写边界。
max_images_per_chapter = 12
image_change_threshold = 0.035

deepseek_context = "history" # 完整追加已成功章节；chapter 为独立逐章请求。
context_token_budget = 200000 # 保守预算，包含输出预留；不是实际计费 token。
context_max_megabytes = 40 # 请求体上限，达到边界后新建上下文组。
reasoning_effort = "none"
qwen_enable_thinking = true
qwen_thinking_budget = 1024
max_output_tokens = 6000
max_calls = 120
# 初稿和独立复审共用上述请求上限；关闭后仅生成 r001。
review_pass = true
max_retries = 2
request_timeout_seconds = 90

# 按顺序执行，省略时默认也是以下两轮。自定义列表会整体替换默认列表。
# 每轮可通过 instruction 多行字符串增加要求；mode="report" 仅登记疑点。
[[review_steps]]
name = "visual"
kind = "visual" # 选图、位置和图注。

[[review_steps]]
name = "content"
kind = "content" # 正文保真、衔接和讲义文体，保留配图。
instruction = ""
