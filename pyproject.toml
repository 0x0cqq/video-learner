[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-learner"
version = "0.1.0"
description = "单视频到图文 Markdown 的转换与修订 CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=16",
    "markdown-it-py>=4.2.0",
    "numpy>=2",
    "openai>=3.8.0",
    "pillow>=11",
    "pydantic>=2.11",
    "rich>=14",
    "typer>=0.16",
]

[project.scripts]
video-learner = "video_learner.cli:main"

[project.optional-dependencies]
local-asr = [
    "faster-whisper>=1.2,<2",
]
local-cuda = [
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", "artifacts", "output", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
